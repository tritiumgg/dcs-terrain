[package]
name = "dcsterrain-cli"
description = "The dcsterrain command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dcsterrain"
path = "src/main.rs"

[dependencies]
anstyle-query = "1.1.5"
clap = { version = "4.6.7", features = ["derive", "string"] }
dcsterrain-core = { path = "../dcsterrain-core" }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
dcsterrain-core = { path = "../dcsterrain-core", features = ["testing"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "sync", "time"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

# The query benchmark times its cases itself and counts allocations, so it
# runs without a bench harness.
[[bench]]
name = "query"
harness = false
