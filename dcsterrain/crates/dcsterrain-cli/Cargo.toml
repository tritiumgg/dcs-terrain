[package]
name = "dcsterrain-cli"
description = "The dcsterrain command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dcsterrain"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dcsterrain-core = { path = "../dcsterrain-core" }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
