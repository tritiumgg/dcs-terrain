[package]
name = "dcsterrain-core"
description = "File decoders and terrain operations over a DCS install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
# Builders of terrain files for other crates' tests: the files are made
# here, never cut from an install.
testing = []

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
