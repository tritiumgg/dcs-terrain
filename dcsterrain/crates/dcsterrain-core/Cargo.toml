[package]
name = "dcsterrain-core"
description = "File decoders and terrain operations over a DCS install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytemuck = "1.19.0"
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }
rayon = "1.11.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[features]
# Builders of terrain files for other crates' tests: the files are made
# here, never cut from an install.
testing = []

[dev-dependencies]
miniz_oxide = "0.9.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

