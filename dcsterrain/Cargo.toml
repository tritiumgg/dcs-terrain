[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tritiumgg/dcs-terrain"
publish = false

# One codegen unit lets the optimizer see each crate whole: 10 to 20 % off
# the point sampling and horizon loops, for a slower release build. Link
# time optimization and abort on panic measured within noise on top.
[profile.release]
codegen-units = 1

# Line tables keep file and line in backtraces and debugger steps, at about
# half the disk of full debug info, which per-variable inspection rarely
# repays here.
[profile.dev]
debug = "line-tables-only"
