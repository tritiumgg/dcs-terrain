# Development toolchain. `mise install` provisions every tool this repository
# builds or tests with, so nothing has to be installed system-wide.

[tools]
# The editor language server, pinned so every machine reports the same
# diagnostics. It ships binaries for all three platforms.
#
# This is the standalone editor binary, not a toolchain component, so it does
# not conflict with rust-toolchain.toml below: that still pins the rustc and
# cargo this server shells out to.
rust-analyzer = "2026-08-31"

[settings]
# Rust is deliberately absent from [tools]. rustup reads rust-toolchain.toml
# whatever mise does, so pinning a version here too would create a second
# source of truth that can disagree with it. This makes mise read that same
# file, so `mise install` provisions Rust and cargo still works without mise.
idiomatic_version_file_enable_tools = ["rust"]

# Tasks. Run project commands through these rather than reaching for the tool
# directly: a non-interactive shell does not pick up mise's PATH activation, so
# a bare `cargo` is the wrong version or missing.
#
# Anything with a loop or a conditional lives in tools/ and is invoked as
# `sh tools/<name>.sh`. mise runs an inline script through cmd on Windows,
# which does not speak sh.

[tasks.fmt]
description = "Format every crate"
dir = "dcsterrain"
run = "cargo fmt --all"

[tasks.test]
description = "Run the workspace test suite"
dir = "dcsterrain"
run = "cargo test --workspace"

[tasks.check]
description = "What CI gates a pull request on"
dir = "dcsterrain"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.bench-bounds]
description = "Hold the operations under their bounds on the synthetic terrain"
dir = "dcsterrain"
env = { DCSTERRAIN_BENCH_BOUNDS = "1" }
run = "cargo bench -p dcsterrain-cli --bench query"

[tasks.docs]
description = "Check the documents: the state file, the citations, the hooks"
run = [
  "sh tools/nospecrefs.sh",
  "sh tools/statecheck.sh",
  "sh tools/readmeopen.sh",
  "sh tools/hooktest.sh",
]
