# classes/Caucasus.toml — hand overrides for the scenery classifier
# (spec-dcsterrain-core.md, "Scenery classification"). Model → class, with
# the reason. Drafted from the live catalogue of 2026-09-02
# (caucasus-scenery-catalogue.tsv: 888 859 objects, 263 models).
#
# Classes: building | industrial | wall | misc. `misc` objects still veto a
# footprint through `scenery_in_footprint_max`; they are kept out of the
# built-up density only.

# --- Bridges, tunnels and crossings: long footprints over rivers and roads,
# not built-up area. Density from them would mark a river as a town.
"MOST(ROAD)BIG" = { class = "misc", reason = "road bridge 15 x 141 m" }
"MOST(ROAD)BIG_END" = { class = "misc", reason = "bridge end segment, no footprint returned" }
"MOST(ROAD)SMALL" = { class = "misc", reason = "road bridge 17 x 70 m" }
"MOST(ROAD)SMALL-A" = { class = "misc", reason = "road bridge" }
"MST(ROAD)SMALL" = { class = "misc", reason = "road bridge" }
"MOST-FERMA" = { class = "misc", reason = "truss bridge 14 x 100 m" }
"MOST-FERMA-A" = { class = "misc", reason = "truss bridge" }
"MOSTIK" = { class = "misc", reason = "small bridge 14 x 56 m" }
"MOSTIK-A" = { class = "misc", reason = "small bridge" }
"MSTIK" = { class = "misc", reason = "small bridge" }
"ONE_PIECE_BRIDGE" = { class = "misc", reason = "bridge 21 x 560 m" }
"ONE_PIECE_BRIDGE02" = { class = "misc", reason = "bridge 21 x 1360 m" }
"PEREHOD" = { class = "misc", reason = "footbridge 5 x 60 m" }
"TUNNEL_ENTRANCE_CAUC_01" = { class = "misc", reason = "tunnel portal" }
"ROKITUNNELENTRANCE01" = { class = "misc", reason = "tunnel portal" }

